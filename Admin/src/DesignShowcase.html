<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub Admin Design System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="App.css">
</head>
<body class="bg-gray-50 text-slate-900">

    <div class="app-container">
        <!-- Dashboard Sidebar -->
        <aside class="sidebar-modern" id="sidebar">
            <div class="mb-10 flex items-center gap-3">
                <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">L</div>
                <span class="text-xl font-bold tracking-tight text-slate-900 brand-name">LearnHub</span>
            </div>
            
            <nav class="flex-1 space-y-1">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-indigo-50 text-indigo-700 rounded-xl font-semibold nav-link active">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-all nav-link">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span class="nav-text">Users</span>
                </a>
            </nav>

            <div class="mt-auto pt-6 border-t border-slate-100 flex items-center justify-between">
                <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-50 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 transition-all border border-slate-100">
                    <svg id="moonIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                </button>
            </div>
        </aside>

        <!-- Main Content Shell -->
        <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc]">
            <header class="h-16 flex items-center justify-between px-8 bg-white border-b border-slate-100 sticky top-0 z-10 shadow-sm glass-effect">
                <div class="flex items-center gap-4 flex-1">
                    <div class="relative w-full max-w-md group">
                        <input type="text" placeholder="Search..." class="input-modern w-full h-10 pl-4 bg-slate-50 border-none hover:bg-slate-100 transition-all focus:bg-white text-sm">
                    </div>
                </div>
            </header>

            <div class="p-10 space-y-10 max-w-7xl mx-auto w-full animate-in">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="card-premium">
                        <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Total Active</p>
                        <h3 class="text-3xl font-black text-slate-900 tracking-tight">1,200</h3>
                        <div class="mt-4"><button class="btn btn-primary w-full">Sync Now</button></div>
                    </div>
                </div>

                <div class="card-premium p-0 overflow-hidden">
                    <table class="table-modern">
                        <thead>
                            <tr><th>User</th><th>Role</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>K Sidhu</td><td>Admin</td><td><span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full text-[11px] font-bold">Verified</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const root = document.documentElement;
            const currentTheme = root.getAttribute('data-theme');
            root.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        });
    </script>
</body>
</html>
